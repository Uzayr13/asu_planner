name: build

# Builds every supported platform on every push and pull request.
#
# Windows can only be compiled on a Windows runner, so this workflow is the
# only place it is proven. It is also the regression net for everything else:
# a red run means something is broken even when the dev machine is happy.
#
# Supported platforms: Android, Windows, Web. iOS and macOS ship as a web app
# (see README); Linux is deliberately out of scope.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: stable

jobs:
  # Tests run before every build. An artifact from a broken tree is worse
  # than no artifact.
  test:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    name: web
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # tool/build_web.sh passes --no-web-resources-cdn so the build is
      # self-contained. The default fetches CanvasKit from gstatic, which
      # renders a blank page wherever that host is unreachable.
      - run: sh tool/build_web.sh /${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          if-no-files-found: error

  android:
    name: android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      # Optional release signing. Without these secrets the build falls back
      # to the debug keystore and is still produced, clearly signed as a local
      # test artifact rather than something to hand to users.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret — release will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$RUNNER_TEMP/release.jks" \
            > android/key.properties
          echo "Release signing configured."

      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "asu-planner-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: asu-planner-windows.zip
          if-no-files-found: error

  # Attach the builds to a GitHub Release when a version tag is pushed.
  #
  # This is where the app's download links point. They cannot be artifacts —
  # those expire after 90 days and the links would rot silently. Releases are
  # permanent, and we already tag every change, so this page doubles as a
  # changelog you can download from.
  #
  # Runs only on a v* tag, never on a branch push.
  release:
    name: release
    needs: [test, android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p dist
          cp artifacts/android-apk/app-release.apk dist/app-release.apk
          cp artifacts/windows-zip/asu-planner-windows.zip dist/windows.zip
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-release.apk
            dist/windows.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
